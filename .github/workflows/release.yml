name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 自带 npm ≥11.5.1——npm Trusted Publishing（OIDC 发布）的硬要求
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:obsidian
      - run: pnpm test
      - run: pnpm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release with plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(jq -r .version manifest.json)" != "$tag" ] || [ "$(jq -r .version package.json)" != "$tag" ]; then
            echo "tag $tag does not match manifest.json/package.json version" && exit 1
          fi
          # 幂等：workflow 部分失败重跑时不因 release 已存在而挂
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, skip create"
          else
            gh release create "$tag" --title "$tag" --generate-notes main.js manifest.json styles.css
          fi
      # npm 与插件同版本号发布（CI 已校验 tag == package.version）。
      # 认证走 Trusted Publishers（OIDC，npmjs.com 后台绑定本 workflow，无需
      # NPM_TOKEN）；provenance 自动生成（公开仓库 + OIDC 发布），无需 flag。
      # npmjs.com 后台配置须与本文件完全一致（大小写敏感）：
      # yourtion/obsidian-feishu-diary + workflow filename「release.yml」+ 无 environment。
      # prepublishOnly 会再跑一遍 build+test 作发布前最终把关。
      - name: Publish CLI to npm
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(npm view feishu-diary@"$tag" version 2>/dev/null)" = "$tag" ]; then
            echo "feishu-diary@$tag already on npm, skip publish"
            exit 0
          fi
          npm publish

name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:obsidian
      - run: pnpm test
      - run: pnpm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release with plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(jq -r .version manifest.json)" != "$tag" ] || [ "$(jq -r .version package.json)" != "$tag" ]; then
            echo "tag $tag does not match manifest.json/package.json version" && exit 1
          fi
          gh release create "$tag" --title "$tag" --generate-notes main.js manifest.json styles.css
